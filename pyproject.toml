[project]
name = "log-record-time-aligner"
version = "0.1.1"
description = "Shifts each source's timestamps onto a common clock to align records."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
